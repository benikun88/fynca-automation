[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --output reports/playwright
    --alluredir=reports/allure-results
    -ra
markers =
    smoke: critical path checks
    sanity: broader regression suite
    login: authentication flows
    canvas: authenticated canvas workspace
    monkey: random interaction resilience
    exploratory: locator discovery and coverage
    xray(id): links a test to a case id
filterwarnings =
    ignore::DeprecationWarning
