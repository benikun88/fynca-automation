name: Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at 00:00 UTC (03:00 Israel)
    - cron: "0 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_report: ${{ steps.allure.outputs.has_report }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.32.0
          curl -fsSL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | sudo tar -xz -C /opt
          sudo ln -sf "/opt/allure-${ALLURE_VERSION}/bin/allure" /usr/local/bin/allure
          allure --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
          mkdir -p reports/allure-results reports/playwright reports/allure-report

      - name: Restore auth storage state
        env:
          FYNCA_STORAGE_STATE_B64: ${{ secrets.FYNCA_STORAGE_STATE_B64 }}
        run: |
          mkdir -p auth
          if [ -n "$FYNCA_STORAGE_STATE_B64" ]; then
            echo "$FYNCA_STORAGE_STATE_B64" | base64 -d > auth/storage_state.json
          else
            echo "Missing FYNCA_STORAGE_STATE_B64 secret" >&2
            exit 1
          fi

      - name: Run tests
        id: pytest
        env:
          FYNCA_BASE_URL: https://app.fynca.io
          FYNCA_CANVAS_URL: ${{ vars.FYNCA_CANVAS_URL }}
        run: |
          export FYNCA_CANVAS_URL="${FYNCA_CANVAS_URL:-https://app.fynca.io/canvas/19a6606e631640d979a4a2de}"
          pytest -m "smoke or canvas or monkey or exploratory" \
            --alluredir=reports/allure-results \
            --output=reports/playwright

      - name: Generate Allure report
        id: allure
        if: always()
        run: |
          mkdir -p allure-site
          if [ -d reports/allure-results ] && [ "$(ls -A reports/allure-results 2>/dev/null)" ]; then
            allure generate reports/allure-results --clean -o reports/allure-report
            cp -r reports/allure-report/. allure-site/
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            printf '<!doctype html><html><body><h1>No Allure results from this run</h1></body></html>' > allure-site/index.html
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "No Allure results found"
            exit 1
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: reports/playwright
          if-no-files-found: ignore

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          if-no-files-found: ignore

      - name: Setup Pages
        if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-site

  deploy-pages:
    needs: test
    if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
